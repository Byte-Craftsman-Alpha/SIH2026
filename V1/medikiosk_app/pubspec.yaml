name: medikiosk_app
description: "AI-Powered Clinical History Intake Platform with AYUSH support."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.0
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  url_launcher: ^6.2.6
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  json_annotation: ^4.9.0
  lottie: ^3.1.0
  http: ^1.2.1
  record: ^5.1.2

dependency_overrides:
  record_linux: 2.1.1
  record_platform_interface: 2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
