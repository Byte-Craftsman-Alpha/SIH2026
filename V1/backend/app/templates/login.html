<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login — MediKiosk</title>
  <link rel="stylesheet" href="/static/css/portal.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-milk);">
  <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem; text-align: center; box-shadow: var(--shadow-lg);">
    <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🌿</div>
    <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-charcoal);">MediKiosk Doctor Portal</h1>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; margin-bottom: 2rem;">
      Hospital Consultation & Triage Access Interface
    </p>

    <form onsubmit="handleLogin(event)" style="text-align: left;">
      <div class="form-group">
        <label class="form-label">Hospital Staff Email</label>
        <input type="email" id="email" class="form-control" placeholder="doctor@aiia.gov.in" value="doctor@aiia.gov.in" required>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" value="demo123" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 1rem;">
        Sign In to Clinical Console →
      </button>
    </form>

    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-soft); font-size: 0.8rem; color: var(--text-muted);">
      <div style="font-weight: 700; margin-bottom: 0.5rem;">⚡ DEMO 1-CLICK LOGIN:</div>
      <div style="display: flex; gap: 0.5rem; justify-content: center;">
        <button class="btn btn-outline" style="font-size: 0.75rem; padding: 4px 10px;" onclick="quickLogin('doctor@aiia.gov.in', 'demo123')">
          👨‍⚕️ Doctor (Dr. Sharma)
        </button>
        <button class="btn btn-outline" style="font-size: 0.75rem; padding: 4px 10px;" onclick="quickLogin('admin@aiia.gov.in', 'admin123')">
          🛡️ Admin (Audits)
        </button>
      </div>
    </div>
  </div>

  <script>
  function quickLogin(email, pwd) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pwd;
    let token = email.includes('admin') ? 'admin_demo_token' : 'doc_demo_token';
    document.cookie = "access_token=" + token + "; path=/;";
    if (email.includes('admin')) {
      window.location.href = '/portal/admin';
    } else {
      window.location.href = '/portal/queue';
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: email, password: password })
    })
    .then(r => r.json())
    .then(data => {
      if (data.access_token) {
        localStorage.setItem('doc_token', data.access_token);
        document.cookie = "access_token=" + data.access_token + "; path=/;";
        
        let role = "doctor";
        try {
          const payload = JSON.parse(atob(data.access_token.split('.')[1]));
          if (payload.role) role = payload.role;
        } catch (err) {}
        
        if (role === 'admin' || email.includes('admin')) {
            window.location.href = '/portal/admin';
        } else {
            window.location.href = '/portal/queue';
        }
      } else {
        alert('Invalid login credentials.');
      }
    })
    .catch(() => {
        alert('Error logging in.');
    });
  }
  </script>
</body>
</html>
